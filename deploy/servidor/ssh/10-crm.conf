# CRM (deploy/servidor/preparar-servidor.sh): só chave, sem root e só duas contas. O firewall já deixa a
# porta 22 só para o IP da Suprens. Este arquivo vem antes dos outros da pasta, e no sshd vale o
# primeiro valor lido: ele ganha do 50-cloud-init.conf.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers @USUARIO_ADMIN@ crm-troca
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# Quem administra abre a administração do CRM por túnel: ssh -L 5179:127.0.0.1:5179. Só esse destino.
Match User @USUARIO_ADMIN@
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:5179

# O extrator só entrega a foto: preso na pasta de troca, só SFTP, com os arquivos legíveis pelo grupo
# do CRM (-u 0027). A chave fica num arquivo do root, com from= do IP da Suprens.
Match User crm-troca
    ChrootDirectory /srv/crm-troca
    ForceCommand internal-sftp -u 0027
    AuthorizedKeysFile /etc/crm/troca-authorized_keys
    PermitTTY no
