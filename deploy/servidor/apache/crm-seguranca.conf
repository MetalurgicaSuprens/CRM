# CRM: o Apache não diz a versão nem aceita TRACE. Substitui o security.conf do Ubuntu.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off
SSLSessionTickets off

# Registro de acesso sem dados pessoais (CLAUDE.md, regra 6): hora, método, caminho sem a query
# string, status e tempo em microssegundos. Sem IP, cookie, referer e navegador.
LogFormat "%t \"%m %U\" %>s %D" crm
