# CRM: os cabeçalhos de segurança dos dois sites (docs/plano.md, "Apache"). Os sites não têm script nem
# estilo embutido nem recurso de outro domínio, e a API fica na mesma origem.
Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set X-Frame-Options "DENY"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"

# O IP que a API registra é o que o Apache viu, nunca um que o navegador mandou.
RequestHeader unset X-Forwarded-For
RequestHeader unset X-Forwarded-Host
LimitRequestBody 65536

# Os arquivos do site têm o hash no nome e não mudam; a página de entrada sempre confere a versão.
<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<Files "index.html">
    Header set Cache-Control "no-cache"
</Files>
