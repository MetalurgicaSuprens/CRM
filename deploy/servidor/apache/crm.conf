# O site do CRM, na internet. O certificado vem do Let's Encrypt pelo mod_md, com o desafio pela própria
# porta 443 (tls-alpn-01): a 80 fica fechada. O certificado novo só vale depois de recarregar o Apache,
# o que o crm-recarregar-apache.timer faz todo dia.
MDomain @DOMINIO@
MDCertificateAgreement accepted
MDCAChallenges tls-alpn-01
MDContactEmail @EMAIL_DO_CERTIFICADO@
Protocols h2 http/1.1 acme-tls/1

<VirtualHost *:443>
    ServerName @DOMINIO@
    SSLEngine on

    DocumentRoot /opt/crm/atual/site
    <Directory /opt/crm>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    # As rotas das telas (/clientes, /ficha/...) são do navegador: todas abrem a mesma página.
    FallbackResource /index.html

    Include /etc/apache2/crm/cabecalhos.conf
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    # O "Perto de mim" do Mapa pede a posição ao aparelho; o resto fica desligado.
    Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()"

    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:5176/api/
    ProxyPassReverse /api/ http://127.0.0.1:5176/api/
    <Location /api/>
        FallbackResource disabled
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/crm-erros.log
    CustomLog ${APACHE_LOG_DIR}/crm-acessos.log crm
</VirtualHost>
