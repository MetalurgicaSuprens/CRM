# A administração do CRM: só nesta máquina, nunca na internet. Quem administra chega por túnel SSH
# (ssh -L 5179:127.0.0.1:5179) e abre http://localhost:5179, que o navegador trata como endereço
# seguro para a chave de acesso.
<VirtualHost 127.0.0.1:5179>
    ServerName localhost

    DocumentRoot /opt/crm/atual/admin
    <Directory /opt/crm>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    FallbackResource /index.html

    Include /etc/apache2/crm/cabecalhos.conf
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()"
    Header always set X-Robots-Tag "noindex, nofollow"

    ProxyPass /api/ http://127.0.0.1:5178/api/
    ProxyPassReverse /api/ http://127.0.0.1:5178/api/
    <Location /api/>
        FallbackResource disabled
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/crm-admin-erros.log
    CustomLog ${APACHE_LOG_DIR}/crm-admin-acessos.log crm
</VirtualHost>
